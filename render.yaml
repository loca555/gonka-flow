# Free preview: no disk, database service, paid instance or paid cron.
# Runtime SQLite is disposable; restart restores WGNK plus targeted public Gonka history.
# KEEP_ALIVE_URL defaults to RENDER_EXTERNAL_URL, keeping the single free instance
# warm so an idle spin-down cannot discard the runtime history between visits.
services:
  - type: web
    name: gonka-flow
    runtime: docker
    plan: free
    region: frankfurt
    numInstances: 1
    dockerfilePath: ./Dockerfile
    healthCheckPath: /healthz
    envVars:
      - key: APP_MODE
        value: mints
      - key: INDEXER_ENABLED
        value: "true"
      - key: LOAD_SEED_ARCHIVE
        value: "true"
      - key: DATA_DIR
        value: /data
      - key: HOST
        value: 0.0.0.0
      - key: POLL_SECONDS
        value: "15"
      - key: ETH_RPC_URLS
        value: https://ethereum.public.blockpi.network/v1/rpc/public,https://eth.drpc.org,https://rpc.mevblocker.io
      - key: ETH_ARCHIVE_RPC_URLS
        value: https://rpc.mevblocker.io,https://ethereum.public.blockpi.network/v1/rpc/public,https://eth.drpc.org
      - key: ETH_RPC_INTERVAL
        value: "1.0"
      - key: ETH_HISTORY_BATCH
        value: "2500"
      # Crash-recovery snapshots on GitHub Releases (public repo).
      - key: SNAPSHOT_REPO
        value: loca555/gonka-flow-snapshots
      - key: SNAPSHOT_HOURS
        value: "6"
      - key: SNAPSHOT_MIN_BLOCKS
        value: "20000"
      - key: SNAPSHOT_RESTORE
        value: "true"
      - key: BACKUP_GITHUB_TOKEN
        sync: false
